<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Доступная карточка товара</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <main>
            <h1>Каталог товаров</h1>
            <!-- Область для объявлений скринридерам -->
            <div aria-live="polite" class="visually-hidden" id="liveregion"></div>
                <!-- Карточка товара -->
            <article class="card" aria-labelledby="product-title" ariadescribedby="product-desc">
                <!-- Декоративное изображение (скрыто от скринридеров) -->
                <div class="card__image-wrapper">
                    <img src="images/product.jpg" alt="" aria-hidden="true"
                    class="card__image">
                    <span class="card__badge" aria-hidden="true">Хит</span>
                </div>
                <!-- Контентная часть -->
                <div class="card__content">
                    <h2 class="card__title" id="product-title">Беспроводные
                    наушники</h2>
                    <p class="card__description" id="product-desc">
                    Отличный звук, шумоподавление и до 30 часов работы без
                    подзарядки.
                    </p>
                    <!-- Цена с ARIA-меткой -->
                    <p class="card__price" aria-label="Цена товара: 7990
                    рублей">
                    <span class="card__price-value">7 990 ₽</span>
                    </p>
                    <!-- Кнопка добавления в корзину -->
                    <button
                    class="card__button button button--primary"
                    type="button"
                    aria-label="Добавить Беспроводные наушники в корзину"
                    onclick="addToCart()"
                    >
                    <span class="button__icon" aria-hidden="true"> </span>
                    <span class="button__text">В корзину</span>
                    </button>
                    <!-- Кнопка "Подробнее" -->
                    <a href="#" class="card__link link" aria-label="Подробнее о
                    Беспроводных наушниках">
                    Подробнее
                    </a>
                </div>
            </article>

            <article class="order-form card" action="/submit-order" method="POST">
                <div class="form-group">
                    <label for="name">Ваше имя и фамилия:</label>
                    <input
                        type="text"
                        id="name"
                        name="customer-name"
                        autocomplete="name"
                        placeholder="Иванов Иван"
                        required>
                </div>
                <div class="form-group">
                    <label for="phone">Контактный номер:</label>
                    <input
                        type="tel"
                        id="phone"
                        name="customer-phone"
                        autocomplete="tel"
                        placeholder="+7 (999) 123-45-67"
                        pattern="^\+7\s?\(?\d{3}\)?\s?\d{3}[-]?\d{2}[-]?\d{2}$"
                        title="Формат +7 (999) 123-34-56"
                        required>
                </div>
                <div class="form-group">
                    <label for="email">Электронная почта:</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="customer_email" 
                        autocomplete="email" 
                        placeholder="example@domain.com" 
                        required>
                    </div>

                    <div class="form-group">
                        <label for="quantity">Количество товара (от 1 до 10 шт.):</label>
                        <input 
                            type="number" 
                            id="quantity" 
                            name="order_quantity" 
                            placeholder="1" 
                            min="1" 
                            max="10" 
                            required>
                    </div>

                    <!-- Индекс с проверкой длины (pattern) -->
                    <div class="form-group">
                        <label for="postal">Почтовый индекс (6 цифр):</label>
                        <input 
                            type="text" 
                            id="postal" 
                            name="postal_code" 
                            autocomplete="postal-code" 
                            placeholder="101000" 
                            pattern="^\d{6}$"
                            title="Индекс должен состоять ровно из 6 цифр"
                            required>
                    </div>

                    <button 
                    class="card__button button button--primary"
                    type="button">
                    Подтвердить заказ</button>

            </article>
        </main>
    </body>
</html>
